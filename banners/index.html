<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Banner — Tras las huellas de León XIV</title>

    <link rel="stylesheet" href="../banners/banner.css">
</head>
<body>

    <!-- Reemplazar "#" por la URL final del especial antes de publicar el banner -->
    <a class="banner" id="banner" href="https://elcomercio.pe/papa-leon-xiv-visita-peru-2026-robert-prevost/" target="_blank" rel="noopener" aria-label="Tras las huellas de León XIV. Ver especial">

        <div class="banner__content">

            <div class="banner__text">
                <div class="banner__title-group">
                    <p class="banner__pretitle">Tras las huellas de</p>
                    <h2 class="banner__title">LEÓN XIV</h2>
                </div>
                <span class="banner__cta">Ver especial</span>
            </div>

            <div class="banner__pope-wrap">
                <img class="banner__pope" src="https://papa-leon-visita-2026.nuevasnarrativas-ec.workers.dev/img/papa-calado-banner.png" alt="">
            </div>

            <div class="banner__countdown">
                <p class="banner__countdown-title">Llegada del Papa</p>

                <div class="banner__countdown-box" role="timer" aria-label="Cuenta regresiva para la llegada de León XIV">
                    <div class="banner__countdown-item">
                        <span class="banner__countdown-label">Días</span>
                        <span class="banner__countdown-value" id="bannerDays">00</span>
                    </div>
                    <span class="separador"></span>
                    <div class="banner__countdown-item">
                        <span class="banner__countdown-label">Horas</span>
                        <span class="banner__countdown-value" id="bannerHours">00</span>
                    </div>
                    <span class="separador"></span>
                    <div class="banner__countdown-item">
                        <span class="banner__countdown-label">Min</span>
                        <span class="banner__countdown-value" id="bannerMins">00</span>
                    </div>
                </div>
            </div>

        </div>
    </a>

    <script src="https://papa-leon-visita-2026.nuevasnarrativas-ec.workers.dev/banners/banner.js"></script>
</body>
</html>
