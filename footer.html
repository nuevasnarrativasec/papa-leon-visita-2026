<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .main-footer {
            background-color: #000;
        }

        .ctn-footer {
            padding: 50px 0;
        }

        img.logo-comercio-blanco {
            display: block;
            margin: 0 auto 60px;
            max-width: 150px;
        }

        .ctn-footer ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ctn-footer ul li {
            text-align: center;
        }

        .ctn-footer ul li p {
            color: #fff;
        }

        .ctn-footer ul li p span {
            font-weight: 600;
        }

        img.btn-nn {
            display: block;
            margin: 30px auto;
            max-width: 180px;
        }
    </style>
</head>
<body>
    <div class="main-footer">
        <div class="ctn-footer">
            <img src="https://papa-leon-visita-2026.nuevasnarrativas-ec.workers.dev/img/logo-comercio-blanco.png" alt="" width="100%" class="logo-comercio-blanco">
            <ul>
                <li>
                    <p>
                        <span>Textos:</span> Lorena Obregón, Gisella Salmón
                    </p>
                </li>
                <li>
                    <p>
                        <span>Investigación Archivo EC:</span> Carlos Batalla
                    </p>
                </li>
                <li>
                    <p>
                        <span>Edición de fotos:</span> Miriam Sánchez
                    </p>
                </li>
            </ul>
            <a href="https://elcomercio.pe/nuevas-narrativas/" target="_blank">
                <img src="https://papa-leon-visita-2026.nuevasnarrativas-ec.workers.dev/img/btn-nn.png" alt="Nuevas Narrativas" class="btn-nn">
            </a>
        </div>
    </div>
</body>
</html>
